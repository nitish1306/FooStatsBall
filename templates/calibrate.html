<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calibration · FooStatsBall</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="page">
    <header class="site-header full">
        <div class="site-header-inner">
            <a href="/" class="brand"><img src="/static/favicon.svg" alt="">FooStatsBall</a>
            <span class="brand-sep">/</span>
            <span class="brand-page">Calibration</span>
        </div>
    </header>

    <main style="padding:1rem;">
        <div class="card toolbar">
            <div class="field">
                <label class="label" for="video-select">Video</label>
                <select id="video-select" class="select"></select>
            </div>
            <div class="field">
                <label class="label" for="pitch-preset">Format</label>
                <select id="pitch-preset" class="select">
                    <option value="5v5">5v5 · 40 x 25 m</option>
                    <option value="6v6">6v6 · 50 x 30 m</option>
                    <option value="7v7">7v7 · 60 x 40 m</option>
                    <option value="8v8" selected>8v8 · 70 x 45 m</option>
                    <option value="9v9">9v9 · 75 x 50 m</option>
                    <option value="10v10">10v10 · 90 x 60 m</option>
                    <option value="11v11">11v11 · 105 x 68 m</option>
                    <option value="futsal">Futsal · 40 x 20 m</option>
                </select>
            </div>
            <div class="grow"></div>
            <span class="badge badge-muted num" id="point-count">Points: 0 / 4 minimum</span>
            <button onclick="undoLastPoint()" class="btn btn-ghost" id="undo-btn" disabled>Undo</button>
            <button onclick="clearAllPoints()" class="btn btn-outline">Clear</button>
            <button onclick="saveCalibration()" class="btn btn-primary" id="save-btn" disabled>Compute and save</button>
        </div>

        <div class="calibrate-panels">
            <section class="card">
                <div class="panel-head"><span class="pane-title">Video frame</span><span class="help">Click a landmark</span></div>
                <div class="panel-body">
                    <div class="frame-container" id="frame-container"><canvas id="frame-canvas"></canvas></div>
                </div>
            </section>
            <section class="card">
                <div class="panel-head"><span class="pane-title">Pitch</span><span class="help">Pick the matching landmark</span></div>
                <div class="panel-body">
                    <div class="pitch-container"><canvas id="pitch-canvas" width="600" height="400"></canvas></div>
                    <div id="landmark-selector" class="landmark-selector" style="display:none;">
                        <p>Which landmark did you click?</p>
                        <div id="landmark-buttons" class="landmark-buttons"></div>
                    </div>
                </div>
            </section>
        </div>

        <section class="card" style="margin-top:1rem;">
            <div class="panel-head"><span class="pane-title">Calibration points</span></div>
            <table class="table" id="points-table">
                <thead><tr><th>#</th><th>Landmark</th><th>Pixel (x, y)</th><th>Pitch (x, y) m</th><th></th></tr></thead>
                <tbody id="points-tbody"></tbody>
            </table>
        </section>

        <div id="result-msg" class="card result-msg"></div>
    </main>

    <script src="/static/js/calibrate.js"></script>
</body>
</html>
