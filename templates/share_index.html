<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FooStatsBall · Matches</title>
    <link rel="icon" href="app/favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app/css/style.css">
</head>
<body class="page">
    <header class="site-header full">
        <div class="site-header-inner">
            <a href="index.html" class="brand"><img src="app/favicon.svg" alt="">FooStatsBall</a>
            <span class="brand-sep">/</span>
            <span class="brand-page">Matches</span>
        </div>
    </header>
    <main style="padding:1rem;max-width:1024px;margin-inline:auto;width:100%;">
        <div id="list" style="display:grid;gap:1rem;"><p class="help">Loading...</p></div>
    </main>
    <script>
    fetch('matches.json', { cache: 'no-cache' }).then(r => r.json()).then(ms => {
        const el = document.getElementById('list');
        if (!ms.length) { el.innerHTML = '<p class="help">No matches published yet.</p>'; return; }
        el.innerHTML = '';
        ms.slice().reverse().forEach(m => {
            const a = document.createElement('a');
            a.className = 'card';
            a.style.cssText = 'display:block;padding:1.25rem;text-decoration:none;color:inherit;';
            a.href = `app/dashboard.html?m=${encodeURIComponent(m.slug)}`;
            const t = document.createElement('div');
            t.style.fontWeight = '600';
            t.textContent = m.title;
            const s = document.createElement('div');
            s.className = 'help';
            s.textContent = `${m.published} · ${Math.round(m.duration_s / 60) || '<1'} min analysed`;
            a.append(t, s);
            el.append(a);
        });
    }).catch(() => { document.getElementById('list').innerHTML = '<p class="help">Could not load matches.</p>'; });
    </script>
</body>
</html>
